<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <script src="https://unpkg.com/streamlit-component-lib@2.0.0/dist/index.js"></script>
  <style>
    html,body{margin:0;padding:0;background:transparent;font-family:Arial,sans-serif}
    .wrap{padding:6px 0}
    button{width:100%;min-height:52px;border:0;border-radius:10px;background:#0052A5;color:#fff;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .name{margin-top:8px;font-size:13px;color:#374151;word-break:break-word}
    input{display:none}
  </style>
</head>
<body>
<div class="wrap">
  <button id="pick" type="button">📷 Choose Photo from Gallery</button>
  <input id="file" type="file" accept="image/*">
  <div id="name" class="name"></div>
</div>
<script>
(function(){
  const pick=document.getElementById('pick'), file=document.getElementById('file'), name=document.getElementById('name');
  const MAX=1600, TARGET=1500000;

  function ready(){ if(window.Streamlit) Streamlit.setFrameHeight(105); }

  function canvasBlob(img, w, h, quality){
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    const ctx=c.getContext('2d',{alpha:false});
    ctx.drawImage(img,0,0,w,h);
    return new Promise(resolve=>c.toBlob(resolve,'image/jpeg',quality));
  }

  async function compressInBrowser(f){
    // Decode locally on the phone first, so the original multi-MB image is NOT
    // sent to Streamlit. Only the compressed JPEG travels over the websocket.
    const url=URL.createObjectURL(f);
    try{
      const img=new Image();
      await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; img.src=url; });
      let w=img.naturalWidth, h=img.naturalHeight;
      const scale=Math.min(1,MAX/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      let q=0.82, blob=await canvasBlob(img,w,h,q);
      while(blob && blob.size>TARGET && q>0.55){ q-=0.07; blob=await canvasBlob(img,w,h,q); }
      if(!blob) throw new Error('Browser compression failed');
      return {blob,w,h,quality:q};
    } finally { URL.revokeObjectURL(url); }
  }

  function blobToDataURL(blob){
    return new Promise((resolve,reject)=>{
      const r=new FileReader(); r.onload=()=>resolve(r.result); r.onerror=reject; r.readAsDataURL(blob);
    });
  }

  async function sendFile(f){
    if(!f) return;
    name.textContent='Optimizing photo on your phone…';
    try{
      const result=await compressInBrowser(f);
      const data=await blobToDataURL(result.blob);
      name.textContent='Ready: '+f.name+' • '+Math.round(result.blob.size/1024)+' KB';
      if(window.Streamlit){
        Streamlit.setComponentValue({
          name:f.name, type:'image/jpeg', size:result.blob.size,
          width:result.w, height:result.h, data:data
        });
      }
    }catch(e){
      // If the browser cannot decode a format such as HEIC, send the original
      // only as a fallback; Python will give a clear unsupported-image message.
      try{
        const data=await blobToDataURL(f);
        name.textContent='Photo selected: '+f.name;
        if(window.Streamlit) Streamlit.setComponentValue({name:f.name,type:f.type||'',size:f.size,data:data});
      }catch(err){ name.textContent='Could not read this photo. Please choose another image.'; }
    }
  }

  pick.addEventListener('click',()=>file.click());
  file.addEventListener('change',()=>{ if(file.files && file.files.length) sendFile(file.files[0]); });
  if(window.Streamlit){
    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT,ready);
    Streamlit.setComponentReady();
    ready();
  }
})();
</script>
</body>
</html>
